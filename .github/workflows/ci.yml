name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firestore/Storage emulators need Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Type check
        run: npm run lint

      - name: ESLint
        run: npm run lint:eslint

      - name: Unit tests
        run: npm test

      - name: Security rules tests (emulators)
        run: npm run test:rules

      - name: Build (web + server bundle)
        run: npm run build
